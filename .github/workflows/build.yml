name: Build PenPDF

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name PenPDF
          --add-data "pdf_master.html;."
          --exclude-module onnxruntime --exclude-module pymupdf4llm
          --exclude-module pymupdf_layout --exclude-module networkx
          --exclude-module tkinter
          PenPDF.py

      - uses: actions/upload-artifact@v4
        with:
          name: PenPDF
          path: dist/PenPDF.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PenPDF.exe
          generate_release_notes: true
